<style>
:root{
  --paper:#f4f2ec;
  --paper-rgb:244,242,236;
  --ink:#22211e;
  --soft:#57534c;
  --line:#cfc9bc;
  --accent:#1e3a6e;
  --accent-hover:#152a52;
  --accent-ink:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#181715;
    --paper-rgb:24,23,21;
    --ink:#f2efe9;
    --soft:#b5afa4;
    --line:#3a3731;
    --accent:#8ab0ff;
    --accent-hover:#a8c5ff;
    --accent-ink:#111318;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#181715;
  --paper-rgb:24,23,21;
  --ink:#f2efe9;
  --soft:#b5afa4;
  --line:#3a3731;
  --accent:#8ab0ff;
  --accent-hover:#a8c5ff;
  --accent-ink:#111318;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:1rem;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:1.125rem/1.7 "Newsreader",Georgia,serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
  overflow-wrap:anywhere;
}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
}
.wrap{max-width:46rem;margin:0 auto;padding:0 1.25rem;position:relative;z-index:2}

/* Background: topic photo + 3D logo */
.photo{position:fixed;inset:0;z-index:0;background:var(--photo,none) center/cover no-repeat;transition:background-image .4s}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(var(--paper-rgb),.86),rgba(var(--paper-rgb),.96))}
.stage{position:fixed;inset:0;z-index:1;perspective:900px;pointer-events:none;overflow:hidden;display:grid;place-items:center}
.stage .rig{width:min(80vmin,34rem);aspect-ratio:1;transform-style:preserve-3d;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-14deg));transition:transform .15s linear}
.stage img{position:absolute;inset:0;width:100%;height:100%;border-radius:18%}
.stage .l1{opacity:.05;transform:translateZ(-160px) scale(1.15);filter:blur(3px)}
.stage .l2{opacity:.08;transform:translateZ(-60px)}
.stage .l3{opacity:.06;transform:translateZ(40px) scale(.96);mix-blend-mode:multiply}
:root[data-theme="dark"] .stage img,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage img{filter:invert(1)}}

/* Header & Navigation */
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-top:1.1rem;padding-bottom:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;font-weight:600;font-size:1.3rem}
.brand img{width:2.25rem;height:2.25rem;border-radius:.55rem;flex-shrink:0}
nav{display:flex;align-items:center;gap:.5rem;font-size:.98rem;flex-wrap:wrap}
nav a{
  text-decoration:none;
  color:var(--ink);
  padding:.42rem .75rem;
  border-radius:.4rem;
  border:1px solid transparent;
  font-weight:500;
  transition:background .15s,border-color .15s,color .15s;
}
nav a:hover{border-color:var(--line);background:rgba(var(--paper-rgb),.8)}
nav a[aria-current="page"]{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
  font-weight:600;
}
#nav-login{
  border:1.5px solid var(--accent);
  color:var(--accent);
  font-weight:600;
}
#nav-login:hover,#nav-login[aria-current="page"]{
  background:var(--accent);
  color:var(--accent-ink);
}

.tabs{
  display:flex;
  gap:.5rem;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:.25rem 0 .95rem;
  border-bottom:1px solid var(--line);
  font-size:.98rem;
}
.tabs::-webkit-scrollbar{display:none}
.tabs a{
  text-decoration:none;
  color:var(--ink);
  white-space:nowrap;
  padding:.4rem .8rem;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(var(--paper-rgb),.75);
  transition:background .15s,color .15s,border-color .15s;
}
.tabs a:hover{border-color:var(--accent);color:var(--accent)}
.tabs a[aria-current="page"]{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
  font-weight:600;
}

/* Sub-tabs */
.subtabs{display:flex;gap:.55rem;flex-wrap:wrap;margin:1.25rem 0 .5rem}
.subtab{
  font:inherit;
  font-size:.95rem;
  font-weight:600;
  min-height:2.5rem;
  padding:.45rem 1rem;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--paper);
  color:var(--ink);
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.subtab:hover{border-color:var(--accent);color:var(--accent)}
.subtab[aria-pressed="true"]{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}

/* Hero & Topic Cards */
.hero{padding:2.25rem 0 1.25rem}
.hero h1{font-size:clamp(1.95rem,6.5vw,3.25rem);line-height:1.12;margin:0 0 .75rem;font-weight:600;letter-spacing:-.01em}
.hero p{margin:0;font-size:1.15rem;color:var(--soft);max-width:36rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;margin:1.75rem 0}
.card{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  min-height:10.5rem;
  padding:1.15rem 1.25rem;
  text-decoration:none;
  color:#ffffff;
  border-radius:.65rem;
  border:1px solid rgba(255,255,255,.15);
  background:linear-gradient(transparent 10%,rgba(10,12,20,.88)),var(--c1) center/cover;
  background-color:var(--c2);
  transition:transform .15s ease;
}
.card:hover{transform:translateY(-2px)}
.card h2{margin:0;font-size:1.35rem}
.card p{margin:.25rem 0 0;font-size:.96rem;opacity:.94;line-height:1.45}
.card:hover h2{text-decoration:underline;text-underline-offset:.2em}
.h2s{font-size:1.25rem;margin:2.25rem 0 .5rem}

/* Post Rows */
.row{display:grid;grid-template-columns:9rem 1fr;gap:0 1.5rem;padding:1.3rem 0;border-top:1px solid var(--line);text-decoration:none}
.row:last-child{border-bottom:1px solid var(--line)}
.row time{font-size:.92rem;color:var(--soft);padding-top:.3rem}
.row h3{margin:0;font-size:1.35rem;line-height:1.3;font-weight:600}
.row p{margin:.3rem 0 0;color:var(--soft)}
.row small{display:block;margin-top:.35rem;color:var(--soft);font-size:.88rem}
.row:hover h3{color:var(--accent);text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1.5px}
.badge{display:inline-block;padding:.1rem .45rem;border-radius:.3rem;font-size:.78rem;font-weight:600;background:var(--accent);color:var(--accent-ink);margin-left:.35rem;vertical-align:middle}

/* Article, Media Attachments & Founder Bio */
.meta{color:var(--soft);font-size:.98rem;margin:1.75rem 0 0}
article h1{font-size:clamp(1.85rem,6vw,2.7rem);line-height:1.15;margin:.5rem 0 1.35rem;font-weight:600;letter-spacing:-.01em}
.prose>*+*{margin-top:1.2rem}
.prose h2{font-size:1.45rem;line-height:1.3;margin-top:2.25rem}
.prose h3{font-size:1.2rem;margin-top:1.85rem}
.prose a{color:var(--accent);font-weight:600;text-underline-offset:.2em}
.prose blockquote{margin-left:0;padding-left:1.25rem;border-left:3px solid var(--accent);font-style:italic}
.prose img{max-width:100%;height:auto;border-radius:.45rem}
.prose pre{overflow-x:auto;padding:1rem;border:1px solid var(--line);border-radius:.45rem;font-size:.92rem}

.media-wrap{margin:1.5rem 0;border:1px solid var(--line);border-radius:.65rem;overflow:hidden;background:rgba(var(--paper-rgb),.8)}
.media-wrap img{display:block;width:100%;max-height:36rem;object-fit:contain;background:#0f0f0f}
.pdf-bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.85rem 1rem;background:rgba(var(--paper-rgb),.95);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pdf-frame{width:100%;height:34rem;border:0;display:block}
.cmedia{margin-top:.75rem}
.cmedia img{max-width:100%;max-height:18rem;border-radius:.45rem;border:1px solid var(--line);display:block}

.founder-box{
  display:flex;
  align-items:center;
  gap:1.35rem;
  padding:1.25rem;
  margin:1.5rem 0;
  border:1px solid var(--line);
  border-radius:.75rem;
  background:rgba(var(--paper-rgb),.75);
}
.founder-dp{
  width:6.25rem;
  height:6.25rem;
  border-radius:50%;
  object-fit:cover;
  object-position:center;
  border:3px solid var(--accent);
  box-shadow:0 4px 14px rgba(0,0,0,.12);
  flex-shrink:0;
  background:var(--line);
}
.founder-box p{margin:0}

.back{display:inline-block;margin-top:2rem;font-size:1rem;color:var(--accent);font-weight:600}
.empty{color:var(--soft);padding:1.75rem 0}
.by a{color:var(--accent);font-weight:600}

/* Comments */
.comments{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--line)}
.comments h2{font-size:1.35rem;margin:0 0 1rem}
.clist{display:grid;gap:1rem;margin-bottom:1.75rem}
.citem{padding:1rem 1.15rem;border:1px solid var(--line);border-radius:.55rem;background:rgba(var(--paper-rgb),.7)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:.92rem;color:var(--soft);margin-bottom:.35rem;flex-wrap:wrap}
.chead strong{color:var(--ink)}
.cbody{margin:0;white-space:pre-wrap;line-height:1.55}

/* Forms & High-Contrast Buttons */
.form{display:grid;gap:1.1rem;max-width:34rem}
.form label{display:grid;gap:.4rem;font-size:1rem;font-weight:600;color:var(--ink)}
.form input,.form select,.form textarea{
  font:inherit;
  font-size:1rem;
  color:var(--ink);
  padding:.75rem .9rem;
  border:1.5px solid var(--line);
  background:var(--paper);
  border-radius:.45rem;
  width:100%;
  min-height:2.85rem;
}
.form input[type="file"]{padding:.55rem .7rem;cursor:pointer}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent)}
.form textarea{min-height:14rem;resize:vertical;line-height:1.55}
.form textarea.short{min-height:6.5rem}
.preview-box{margin-top:.35rem;padding:.65rem;border:1px dashed var(--line);border-radius:.45rem;font-size:.92rem;color:var(--soft)}
.preview-box img{max-height:11rem;border-radius:.35rem;display:block;margin-top:.4rem}

.btn{
  font:inherit;
  font-size:1rem;
  font-weight:600;
  min-height:2.85rem;
  padding:.7rem 1.35rem;
  border:2px solid var(--accent);
  border-radius:.45rem;
  background:var(--accent);
  color:var(--accent-ink);
  cursor:pointer;
  justify-self:start;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  text-decoration:none;
  box-shadow:0 2px 6px rgba(0,0,0,.14);
  transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.secondary{
  background:transparent;
  color:var(--accent);
  box-shadow:none;
}
.btn.secondary:hover{background:var(--accent);color:var(--accent-ink)}

.linkbtn{
  font:inherit;
  font-weight:600;
  padding:.2rem .35rem;
  border:0;
  background:none;
  color:var(--accent);
  text-decoration:underline;
  text-underline-offset:.2em;
  cursor:pointer;
}
.note{color:var(--soft);font-size:1rem;margin:0}
.flinks{display:flex;gap:1.1rem;flex-wrap:wrap}
footer{margin-top:4.5rem;padding:2rem 0 3rem;border-top:1px solid var(--line);color:var(--soft);font-size:.95rem;position:relative;z-index:2}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* Mobile Layout Optimization */
@media (max-width:40rem){
  body{font-size:1.05rem;line-height:1.65}
  .wrap{padding:0 1rem}
  header .wrap{padding-top:.85rem;gap:.65rem}
  .brand{font-size:1.2rem}
  nav{width:100%;justify-content:space-between;gap:.35rem;padding-top:.25rem;border-top:1px solid var(--line)}
  nav a{flex:1;text-align:center;padding:.45rem .5rem;font-size:.92rem}
  .hero{padding:1.5rem 0 1rem}
  .cards{grid-template-columns:1fr;gap:.85rem;margin:1.25rem 0}
  .card{min-height:9rem;padding:1rem 1.1rem}
  .row{grid-template-columns:1fr;padding:1.15rem 0}
  .row time{padding:0 0 .25rem;font-size:.88rem}
  .row h3{font-size:1.25rem}
  .pdf-frame{height:24rem}
  .founder-box{flex-direction:column;text-align:center;padding:1.15rem 1rem;gap:1rem}
  .founder-dp{width:5.75rem;height:5.75rem}
  .btn{width:100%}
  .form input,.form select,.form textarea{font-size:16px}
  footer{margin-top:3rem;padding:1.5rem 0 2.25rem}
  footer .wrap{flex-direction:column;gap:.75rem}
}
@media (prefers-reduced-motion:reduce){.stage .rig,.photo,.card,.btn{transition:none}}
</style>

  function fmt(d) {
    var dt = new Date(String(d).slice(0, 10) + "T00:00:00");
    return isNaN(dt.getTime()) ? String(d) : dt.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  }
  function mins(t) { return Math.max(1, Math.round(String(t || "").split(/\s+/).length / 220)); }
  function md(t) {
    var raw = window.marked ? marked.parse(String(t || "")) : esc(t);
    return window.DOMPurify ? DOMPurify.sanitize(raw, { ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^a-z]|[a-z+.-]+(?:[^a-z+.-:]|$))/i }) : raw;
  }
  function ig(h) { return /^[A-Za-z0-9._]{1,30}$/.test(h || "") ? h : ""; }
  function safeMediaUrl(u) {
    if (!u) return "";
    try {
      var parsed = new URL(u, location.origin);
      if (parsed.protocol === "https:" || parsed.origin === location.origin) return parsed.href;
    } catch (_e) {}
    return "";
  }

  function validateFile(file) {
    if (!file) return null;
    if (ALLOWED_TYPES.indexOf(file.type) === -1) {
      return "Unsupported file type. Upload JPG, PNG, WEBP, GIF, or PDF only.";
    }
    if (file.size > MAX_BYTES) {
      return "File is too large. Maximum allowed size is 10 MB.";
    }
    return null;
  }

  function uploadAttachment(file, folder) {
    if (!file) return Promise.resolve({ url: null, type: null });
    var err = validateFile(file);
    if (err) return Promise.reject(new Error(err));

    var ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
    var mediaType = file.type === "application/pdf" ? "pdf" : "image";
    var path = user.id + "/" + folder + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;

    return sb.storage.from("attachments").upload(path, file, {
      cacheControl: "3600",
      contentType: file.type,
      upsert: false
    }).then(function (res) {
      if (res.error) throw new Error("Upload failed: " + res.error.message);
      var pub = sb.storage.from("attachments").getPublicUrl(path);
      return { url: pub.data.publicUrl, type: mediaType };
    });
  }

  function bindFilePreview(inputEl, previewEl) {
    if (!inputEl || !previewEl) return;
    inputEl.onchange = function () {
      var file = inputEl.files && inputEl.files[0];
      if (!file) { previewEl.innerHTML = ""; return; }
      var err = validateFile(file);
      if (err) {
        previewEl.innerHTML = '<span style="color:#b00020;font-weight:600">' + esc(err) + '</span>';
        inputEl.value = "";
        return;
      }
      var sizeMb = (file.size / (1024 * 1024)).toFixed(2);
      if (file.type === "application/pdf") {
        previewEl.innerHTML = '<strong>PDF selected:</strong> ' + esc(file.name) + ' (' + sizeMb + ' MB)';
      } else {
        var objUrl = URL.createObjectURL(file);
        previewEl.innerHTML = '<strong>Photo selected:</strong> ' + esc(file.name) + ' (' + sizeMb + ' MB)<img src="' + objUrl + '" alt="Selected preview">';
      }
    };
  }

  function renderAttachmentBlock(url, type, title) {
    var clean = safeMediaUrl(url);
    if (!clean) return "";
    if (type === "pdf") {
      return '<div class="media-wrap">' +
        '<div class="pdf-bar"><span><strong>Attached PDF Document</strong></span>' +
        '<a class="btn secondary" style="min-height:2.2rem;padding:.35rem .85rem;font-size:.9rem" href="' + esc(clean) + '" target="_blank" rel="noopener noreferrer">Open / Download PDF</a></div>' +
        '<iframe class="pdf-frame" src="' + esc(clean) + '#view=FitH" title="' + esc(title || "PDF Attachment") + '" loading="lazy"></iframe>' +
        '</div>';
    }
    if (type === "image") {
      return '<figure class="media-wrap"><img src="' + esc(clean) + '" alt="' + esc(title || "Attached photo") + '" loading="lazy"></figure>';
    }
    return "";
  }

  function renderComments(postId) {
    var box = document.getElementById("comments-box");
    if (!box) return;
    if (!sb) {
      box.innerHTML = '<section class="comments"><h2>Comments</h2><p class="note">Comments require Supabase to be connected.</p></section>';
      return;
    }

    var formHtml = user
      ? '<form class="form" id="cform">' +
        '<label>Add a comment<textarea class="short" name="body" minlength="1" maxlength="2000" placeholder="Share your thoughts on this piece..." required></textarea></label>' +
        '<label>Attach a photo or PDF (optional, max 10 MB)<input type="file" name="media" id="c-media" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf"></label>' +
        '<div id="c-preview" class="preview-box" style="display:none"></div>' +
        '<button class="btn" type="submit" id="csub">Post comment</button><p class="note" role="status" id="cmsg"></p></form>'
      : '<p class="note"><a href="#login">Log in</a> to join the discussion and post comments, photos, or PDFs.</p>';

    box.innerHTML = '<section class="comments"><h2>Comments (<span id="ccount">0</span>)</h2><div class="clist" id="clist"><p class="note">Loading comments…</p></div>' + formHtml + '</section>';

    var cMediaInput = document.getElementById("c-media");
    var cPreview = document.getElementById("c-preview");
    if (cMediaInput && cPreview) {
      cMediaInput.addEventListener("change", function () {
        cPreview.style.display = cMediaInput.files.length ? "block" : "none";
      });
      bindFilePreview(cMediaInput, cPreview);
    }

    function loadList() {
      sb.from("comments").select("id,user_id,author_name,instagram,body,media_url,media_type,created_at").eq("post_id", postId).order("created_at", { ascending: true })
        .then(function (r) {
          var items = r.data || [];
          var countEl = document.getElementById("ccount");
          var clist = document.getElementById("clist");
          if (!countEl || !clist) return;
          countEl.textContent = items.length;
          if (!items.length) {
            clist.innerHTML = '<p class="note">No comments yet. Be the first to respond.</p>';
            return;
          }
          clist.innerHTML = "";
          items.forEach(function (c) {
            var div = document.createElement("div");
            div.className = "citem";
            var head = document.createElement("div");
            head.className = "chead";

            var left = document.createElement("span");
            var strong = document.createElement("strong");
            strong.textContent = c.author_name;
            left.appendChild(strong);
            if (ig(c.instagram)) {
              var a = document.createElement("a");
              a.href = "https://instagram.com/" + ig(c.instagram);
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = " (@" + ig(c.instagram) + ")";
              left.appendChild(a);
            }
            left.append(" · " + fmt(c.created_at));
            head.appendChild(left);

            if (user && user.id === c.user_id) {
              var del = document.createElement("button");
              del.type = "button";
              del.className = "linkbtn";
              del.textContent = "Delete";
              del.onclick = function () {
                sb.from("comments").delete().eq("id", c.id).then(loadList);
              };
              head.appendChild(del);
            }

            var p = document.createElement("p");
            p.className = "cbody";
            p.textContent = c.body;

            div.appendChild(head);
            div.appendChild(p);

            var cleanMedia = safeMediaUrl(c.media_url);
            if (cleanMedia) {
              var mWrap = document.createElement("div");
              mWrap.className = "cmedia";
              if (c.media_type === "pdf") {
                var pdfLink = document.createElement("a");
                pdfLink.className = "btn secondary";
                pdfLink.style.minHeight = "2.2rem";
                pdfLink.style.padding = ".35rem .85rem";
                pdfLink.style.fontSize = ".9rem";
                pdfLink.href = cleanMedia;
                pdfLink.target = "_blank";
                pdfLink.rel = "noopener noreferrer";
                pdfLink.textContent = "View Attached PDF";
                mWrap.appendChild(pdfLink);
              } else if (c.media_type === "image") {
                var img = document.createElement("img");
                img.src = cleanMedia;
                img.alt = "Comment attachment by " + c.author_name;
                img.loading = "lazy";
                mWrap.appendChild(img);
              }
              div.appendChild(mWrap);
            }

            clist.appendChild(div);
          });
        });
    }

    loadList();

    var cf = document.getElementById("cform");
    if (cf) {
      cf.onsubmit = function (e) {
        e.preventDefault();
        var now = Date.now();
        var cmsg = document.getElementById("cmsg");
        var csub = document.getElementById("csub");
        if (now - lastActionAt < 5000) {
          cmsg.textContent = "Please wait a few seconds before posting again.";
          return;
        }
        var text = cf.body.value.trim();
        if (!text) return;
        var file = cf.media && cf.media.files ? cf.media.files[0] : null;
        var fileErr = validateFile(file);
        if (fileErr) { cmsg.textContent = fileErr; return; }

        lastActionAt = now;
        csub.disabled = true;
        cmsg.textContent = file ? "Uploading attachment & posting…" : "Posting…";

        uploadAttachment(file, "comment").then(function (uploaded) {
          var m = user.user_metadata || {};
          return sb.from("comments").insert({
            post_id: postId,
            author_name: (m.name || user.email.split("@")[0]).slice(0, 60),
            instagram: ig(m.instagram) || null,
            body: text,
            media_url: uploaded.url,
            media_type: uploaded.type
          });
        }).then(function (r) {
          csub.disabled = false;
          if (r.error) { cmsg.textContent = "Couldn't post comment: " + r.error.message; return; }
          cf.reset();
          if (cPreview) { cPreview.innerHTML = ""; cPreview.style.display = "none"; }
          cmsg.textContent = "";
          loadList();
        }).catch(function (err) {
          csub.disabled = false;
          cmsg.textContent = err.message || "Upload error.";
        });
      };
    }
  }

      '<label>Short summary<input name="excerpt" maxlength="200"></label>' +
      '<label>Attach a photo or PDF (optional, max 10 MB)<input type="file" name="media" id="w-media" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf"></label>' +
      '<div id="w-preview" class="preview-box" style="display:none"></div>' +
      '<label>Your text / caption<textarea name="body" minlength="10" maxlength="20000" placeholder="Write your essay, notes, or description for your attached photo/PDF..." required></textarea></label>' +
      '<button class="btn" type="submit" id="wsub">Submit for review</button><p class="note" role="status" id="msg"></p></form></article>';

    var secSel = document.getElementById("sec-sel");
    var subWrap = document.getElementById("sub-wrap");
    if (defaultSec && S[defaultSec]) secSel.value = defaultSec;
    function toggleSub() { subWrap.style.display = secSel.value === "science" ? "grid" : "none"; }
    secSel.onchange = toggleSub;
    toggleSub();

    var wMediaInput = document.getElementById("w-media");
    var wPreview = document.getElementById("w-preview");
    if (wMediaInput && wPreview) {
      wMediaInput.addEventListener("change", function () {
        wPreview.style.display = wMediaInput.files.length ? "block" : "none";
      });
      bindFilePreview(wMediaInput, wPreview);
    }

    document.getElementById("wf").onsubmit = function (e) {
      e.preventDefault();
      var now = Date.now();
      var msg = document.getElementById("msg");
      var wsub = document.getElementById("wsub");
      if (now - lastActionAt < 10000) {
        msg.textContent = "Please wait a few seconds before submitting again.";
        return;
      }
      var f = e.target;
      var file = f.media && f.media.files ? f.media.files[0] : null;
      var fileErr = validateFile(file);
      if (fileErr) { msg.textContent = fileErr; return; }

      lastActionAt = now;
      wsub.disabled = true;
      msg.textContent = file ? "Uploading file & submitting…" : "Submitting…";

      uploadAttachment(file, "post").then(function (uploaded) {
        var m = user.user_metadata || {};
        var payload = {
          section: f.section.value,
          sub_section: f.section.value === "science" ? f.sub_section.value : null,
          title: f.title.value.trim(),
          excerpt: f.excerpt.value.trim(),
          body: f.body.value,
          media_url: uploaded.url,
          media_type: uploaded.type,
          author_name: (m.name || user.email.split("@")[0]).slice(0, 60),
          instagram: ig(m.instagram) || null
        };
        return sb.from("posts").insert(payload);
      }).then(function (r) {
        wsub.disabled = false;
        if (r.error) { msg.textContent = "Couldn’t submit: " + r.error.message; return; }
        f.reset();
        if (wPreview) { wPreview.innerHTML = ""; wPreview.style.display = "none"; }
        toggleSub();
        msg.textContent = "Submitted! It will appear once approved.";
      }).catch(function (err) {
        wsub.disabled = false;
        msg.textContent = err.message || "Upload error.";
      });
    };
  }

  function route() {
    var raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var parts = raw.split("?");
    var h = parts[0];
    var params = new URLSearchParams(parts[1] || "");
    if (!h) home();
    else if (S[h]) section(h);
    else if (h === "about") about();
    else if (h === "login") login();
    else if (h === "write") write(params.get("section"));
    else post(h);
    window.scrollTo(0, 0);
  }

  function loadCommunity() {
    if (!sb) return Promise.resolve();
    return sb.from("posts").select("id,title,section,sub_section,excerpt,body,media_url,media_type,created_at,author_name,instagram").eq("approved", true).order("created_at", { ascending: false }).limit(100)
      .then(function (r) { community = r.data || []; });
  }

  function refresh() {
    document.getElementById("nav-login").textContent = user ? "Account" : "Log in";
    if (/^#(login|write)/.test(location.hash)) route();
  }

  var rig = document.getElementById("rig");
  if (!window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    window.addEventListener("pointermove", function (e) {
      rig.style.setProperty("--ry", ((e.clientX / innerWidth - .5) * 30) + "deg");
      rig.style.setProperty("--rx", ((.5 - e.clientY / innerHeight) * 20) + "deg");
    });
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.update(); });
      });
      navigator.serviceWorker.register("sw.js");
    });
  }
  window.addEventListener("hashchange", route);
  route();
  if (sb) {
    sb.auth.getSession().then(function (r) { user = r.data.session ? r.data.session.user : null; refresh(); });
    sb.auth.onAuthStateChange(function (_e, s) { user = s ? s.user : null; refresh(); });
    loadCommunity().then(function () { if (!/^#(login|write|about)/.test(location.hash)) route(); });
  }
})();
</script>
</body>
</html>
