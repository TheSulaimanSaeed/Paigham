<style>
:root{
  --bg:#f4f6f9;
  --bg-rgb:244,246,249;
  --surface:#ffffff;
  --surface-alt:#eef2f6;
  --ink:#141b24;
  --soft:#4b5868;
  --line:#d5dde6;
  --accent:#0d3b66;
  --accent-hover:#092948;
  --accent-ink:#ffffff;
  --teal:#0f766e;
  --teal-bg:#e6f4f1;
  --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,serif;
  --shadow:0 2px 10px rgba(15,28,46,.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f141a;
    --bg-rgb:15,20,26;
    --surface:#171f29;
    --surface-alt:#1e2835;
    --ink:#eef2f7;
    --soft:#9fb0c4;
    --line:#2b3747;
    --accent:#5da9ff;
    --accent-hover:#82beff;
    --accent-ink:#0b131e;
    --teal:#34d399;
    --teal-bg:rgba(52,211,153,.14);
    --shadow:0 4px 16px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141a;
  --bg-rgb:15,20,26;
  --surface:#171f29;
  --surface-alt:#1e2835;
  --ink:#eef2f7;
  --soft:#9fb0c4;
  --line:#2b3747;
  --accent:#5da9ff;
  --accent-hover:#82beff;
  --accent-ink:#0b131e;
  --teal:#34d399;
  --teal-bg:rgba(52,211,153,.14);
  --shadow:0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:1rem;-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:1rem/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
  overflow-wrap:anywhere;
}
a{color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem;position:relative;z-index:2}

/* Subtle Ambient Background */
.photo{position:fixed;inset:0;z-index:0;background:var(--photo,none) center/cover no-repeat;opacity:.14;transition:background-image .4s}
.stage{position:fixed;inset:0;z-index:1;perspective:900px;pointer-events:none;overflow:hidden;display:grid;place-items:center}
.stage .rig{width:min(70vmin,28rem);aspect-ratio:1;transform-style:preserve-3d;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-14deg));transition:transform .15s linear}
.stage img{position:absolute;inset:0;width:100%;height:100%;border-radius:18%}
.stage .l1{opacity:.025;transform:translateZ(-160px) scale(1.15);filter:blur(3px)}
.stage .l2{opacity:.04;transform:translateZ(-60px)}
.stage .l3{opacity:.03;transform:translateZ(40px) scale(.96)}
:root[data-theme="dark"] .stage img,
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage img{filter:invert(1)}}

/* Top Academic Header Bar */
header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(var(--bg-rgb),.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
header .top-bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;font-weight:700;font-size:1.25rem;letter-spacing:-.02em;color:var(--accent)}
.brand img{width:2.15rem;height:2.15rem;border-radius:.5rem;flex-shrink:0}
.brand small{font-size:.75rem;font-weight:600;color:var(--soft);background:var(--surface-alt);padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line)}

nav{display:flex;align-items:center;gap:.45rem;font-size:.9rem;flex-wrap:wrap}
nav a{
  text-decoration:none;
  color:var(--ink);
  padding:.45rem .8rem;
  border-radius:.45rem;
  border:1px solid transparent;
  font-weight:600;
  transition:all .15s;
}
nav a:hover{background:var(--surface);border-color:var(--line)}
nav a[aria-current="page"]{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}
#nav-write{
  background:var(--teal-bg);
  color:var(--teal);
  border-color:rgba(15,118,110,.25);
}
#nav-write:hover,#nav-write[aria-current="page"]{
  background:var(--teal);
  color:#ffffff;
}
#nav-login{
  border:1.5px solid var(--accent);
  color:var(--accent);
}
#nav-login:hover,#nav-login[aria-current="page"]{
  background:var(--accent);
  color:var(--accent-ink);
}

/* Section Tabs */
.tabs{
  display:flex;
  gap:.45rem;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:.45rem 0 .65rem;
  border-top:1px solid var(--line);
  font-size:.9rem;
}
.tabs::-webkit-scrollbar{display:none}
.tabs a{
  text-decoration:none;
  color:var(--soft);
  white-space:nowrap;
  padding:.38rem .85rem;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--surface);
  font-weight:600;
  transition:all .15s;
}
.tabs a:hover{border-color:var(--accent);color:var(--accent)}
.tabs a[aria-current="page"]{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}

/* Science Sub-tabs */
.subtabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0 1.25rem}
.subtab{
  font:inherit;
  font-size:.88rem;
  font-weight:600;
  min-height:2.35rem;
  padding:.4rem .95rem;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:var(--surface);
  color:var(--ink);
  cursor:pointer;
  transition:all .15s;
}
.subtab:hover{border-color:var(--accent);color:var(--accent)}
.subtab[aria-pressed="true"]{
  background:var(--accent);
  color:var(--accent-ink);
  border-color:var(--accent);
}

/* Hero Banner */
.hero{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:.85rem;
  padding:1.75rem;
  margin:1.5rem 0;
  box-shadow:var(--shadow);
}
.hero h1{font-family:var(--serif);font-size:clamp(1.75rem,4.5vw,2.5rem);line-height:1.15;margin:0 0 .65rem;font-weight:600;letter-spacing:-.01em}
.hero p{margin:0;font-size:1.02rem;color:var(--soft);max-width:44rem}
.hero-actions{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:1.15rem}

/* Domain Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:.9rem;margin:1.25rem 0 2rem}
.card{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  min-height:9.5rem;
  padding:1.1rem 1.15rem;
  text-decoration:none;
  color:#ffffff;
  border-radius:.75rem;
  border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(transparent 10%,rgba(10,16,28,.9)),var(--c1) center/cover;
  background-color:var(--c2);
  box-shadow:var(--shadow);
  transition:transform .15s ease;
}
.card:hover{transform:translateY(-2px)}
.card h2{margin:0;font-size:1.2rem;font-weight:700}
.card p{margin:.25rem 0 0;font-size:.88rem;opacity:.92;line-height:1.4}

/* Two-column Research Feed Layout */
.feed-layout{display:grid;grid-template-columns:1fr 18.5rem;gap:1.5rem;align-items:start;margin-top:1rem}
.feed-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.85rem;flex-wrap:wrap}
.feed-head h2{margin:0;font-size:1.15rem;font-weight:700}

/* ResearchGate-Style Feed Cards */
.feed-list{display:grid;gap:.9rem}
.pcard{
  display:block;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:.75rem;
  padding:1.25rem;
  text-decoration:none;
  box-shadow:var(--shadow);
  transition:border-color .15s,transform .12s;
}
.pcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.65rem;flex-wrap:wrap}
.pcard-author{display:flex;align-items:center;gap:.6rem}
.avatar-sm{width:2.1rem;height:2.1rem;border-radius:50%;object-fit:cover;background:var(--surface-alt);border:1.5px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:.82rem;color:var(--accent)}
.pcard-meta{font-size:.83rem;color:var(--soft);line-height:1.3}
.pcard-meta strong{color:var(--ink);display:block;font-size:.9rem}
.badges{display:flex;gap:.35rem;flex-wrap:wrap}
.badge{display:inline-block;padding:.18rem .55rem;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--surface-alt);color:var(--accent);border:1px solid var(--line)}
.badge.review{background:var(--teal-bg);color:var(--teal);border-color:rgba(15,118,110,.25)}
.badge.media{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pcard h3{margin:0 0 .35rem;font-family:var(--serif);font-size:1.35rem;line-height:1.25;font-weight:600;color:var(--ink)}
.pcard:hover h3{color:var(--accent)}
.pcard p{margin:0;color:var(--soft);font-size:.94rem;line-height:1.5}
.pcard-foot{margin-top:.85rem;padding-top:.65rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:.82rem;color:var(--soft)}

/* Sidebar Panels */
.side-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:.75rem;
  padding:1.15rem;
  box-shadow:var(--shadow);
  margin-bottom:1rem;
}
.side-box h3{margin:0 0 .75rem;font-size:.98rem;font-weight:700}
.member-item{display:flex;align-items:flex-start;gap:.65rem;padding:.65rem 0;border-top:1px solid var(--line)}
.member-item:first-of-type{border-top:0;padding-top:0}
.member-info{font-size:.84rem;line-height:1.35}
.member-info strong{display:block;color:var(--ink);font-size:.9rem}
.member-info span{color:var(--teal);font-weight:600;display:block}
.member-info small{color:var(--soft);display:block;margin-top:.15rem}

/* Article View */
.article-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:.85rem;
  padding:1.75rem;
  margin:1.5rem 0;
  box-shadow:var(--shadow);
}
.meta{color:var(--soft);font-size:.9rem;margin:0}
article h1{font-family:var(--serif);font-size:clamp(1.75rem,5vw,2.55rem);line-height:1.15;margin:.5rem 0 1.25rem;font-weight:600}
.prose{font-family:var(--serif);font-size:1.12rem;line-height:1.72}
.prose>*+*{margin-top:1.15rem}
.prose h2{font-family:var(--sans);font-size:1.3rem;line-height:1.3;margin-top:2rem}
.prose h3{font-family:var(--sans);font-size:1.1rem;margin-top:1.65rem}
.prose a{color:var(--accent);font-weight:600;text-underline-offset:.2em}
.prose blockquote{margin-left:0;padding-left:1.15rem;border-left:3px solid var(--accent);font-style:italic;color:var(--soft)}
.prose img{max-width:100%;height:auto;border-radius:.5rem}
.prose pre{overflow-x:auto;padding:1rem;border:1px solid var(--line);border-radius:.5rem;font-size:.9rem;background:var(--surface-alt)}

.author-banner{
  display:flex;
  align-items:center;
  gap:1rem;
  padding:1rem;
  margin-top:1.75rem;
  border-radius:.65rem;
  background:var(--surface-alt);
  border:1px solid var(--line);
}
.author-banner .avatar-lg{width:3.5rem;height:3.5rem;border-radius:50%;object-fit:cover;border:2px solid var(--accent);flex-shrink:0;display:grid;place-items:center;font-weight:700;background:var(--surface);color:var(--accent)}

/* Media Attachments */
.media-wrap{margin:1.35rem 0;border:1px solid var(--line);border-radius:.65rem;overflow:hidden;background:var(--surface-alt)}
.media-wrap img{display:block;width:100%;max-height:36rem;object-fit:contain;background:#0d1117}
.pdf-bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 1rem;background:var(--surface-alt);border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:.9rem}
.pdf-frame{width:100%;height:34rem;border:0;display:block}
.cmedia{margin-top:.75rem}
.cmedia img{max-width:100%;max-height:18rem;border-radius:.45rem;border:1px solid var(--line);display:block}

/* Founder Box */
.founder-box{
  display:flex;
  align-items:center;
  gap:1.35rem;
  padding:1.25rem;
  margin:1.25rem 0;
  border:1px solid var(--line);
  border-radius:.75rem;
  background:var(--surface-alt);
}
.founder-dp{
  width:6.25rem;
  height:6.25rem;
  border-radius:50%;
  object-fit:cover;
  object-position:center;
  border:3px solid var(--accent);
  box-shadow:0 4px 14px rgba(0,0,0,.12);
  flex-shrink:0;
  background:var(--surface);
}
.founder-box p{margin:0;font-family:var(--sans);font-size:.98rem;line-height:1.6}

/* Profile Header Banner */
.profile-header{
  display:flex;
  align-items:center;
  gap:1.25rem;
  padding-bottom:1.25rem;
  margin-bottom:1.5rem;
  border-bottom:1px solid var(--line);
}
.profile-dp{
  width:5.25rem;
  height:5.25rem;
  border-radius:50%;
  object-fit:cover;
  border:3px solid var(--accent);
  background:var(--surface-alt);
  flex-shrink:0;
  display:grid;
  place-items:center;
  font-size:1.5rem;
  font-weight:700;
  color:var(--accent);
}

/* Comments */
.comments{margin-top:2.25rem;padding-top:1.75rem;border-top:1px solid var(--line)}
.comments h2{font-size:1.2rem;margin:0 0 1rem}
.clist{display:grid;gap:.85rem;margin-bottom:1.5rem}
.citem{padding:1rem;border:1px solid var(--line);border-radius:.65rem;background:var(--surface-alt)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.85rem;color:var(--soft);margin-bottom:.45rem;flex-wrap:wrap}
.cuser{display:flex;align-items:center;gap:.5rem}
.cbody{margin:0;white-space:pre-wrap;line-height:1.55;font-size:.96rem}

/* Forms & Buttons */
.form{display:grid;gap:1rem;max-width:36rem}
.form label{display:grid;gap:.35rem;font-size:.92rem;font-weight:600;color:var(--ink)}
.form label span.req{color:#c81e1e}
.form input,.form select,.form textarea{
  font:inherit;
  font-size:.98rem;
  color:var(--ink);
  padding:.7rem .85rem;
  border:1.5px solid var(--line);
  background:var(--surface);
  border-radius:.5rem;
  width:100%;
  min-height:2.75rem;
}
.form input[type="file"]{padding:.5rem .65rem;cursor:pointer}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--accent)}
.form textarea{min-height:13rem;resize:vertical;line-height:1.55}
.form textarea.short{min-height:5.5rem}
.preview-box{margin-top:.25rem;padding:.65rem;border:1px dashed var(--line);border-radius:.5rem;font-size:.88rem;color:var(--soft)}
.preview-box img{max-height:10rem;border-radius:.4rem;display:block;margin-top:.4rem}

.btn{
  font:inherit;
  font-size:.94rem;
  font-weight:600;
  min-height:2.75rem;
  padding:.65rem 1.25rem;
  border:2px solid var(--accent);
  border-radius:.5rem;
  background:var(--accent);
  color:var(--accent-ink);
  cursor:pointer;
  justify-self:start;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  text-decoration:none;
  transition:all .15s;
}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.secondary{background:transparent;color:var(--accent)}
.btn.secondary:hover{background:var(--accent);color:var(--accent-ink)}

.linkbtn{
  font:inherit;
  font-size:.9rem;
  font-weight:600;
  padding:.2rem .3rem;
  border:0;
  background:none;
  color:var(--accent);
  text-decoration:underline;
  text-underline-offset:.2em;
  cursor:pointer;
}
.note{color:var(--soft);font-size:.94rem;margin:0}
.back{display:inline-block;margin-top:1.75rem;font-size:.95rem;color:var(--accent);font-weight:600}
.empty{color:var(--soft);padding:1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:.75rem}

.flinks{display:flex;gap:1.1rem;flex-wrap:wrap}
footer{margin-top:4rem;padding:1.75rem 0 2.5rem;border-top:1px solid var(--line);color:var(--soft);font-size:.9rem;position:relative;z-index:2;background:var(--surface)}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}

/* Mobile Layout Optimization */
@media (max-width:52rem){
  .feed-layout{grid-template-columns:1fr}
}
@media (max-width:40rem){
  .wrap{padding:0 .95rem}
  header .top-bar{padding:.65rem 0;gap:.5rem}
  .brand{font-size:1.15rem}
  .brand small{display:none}
  nav{width:100%;justify-content:space-between;gap:.35rem}
  nav a{flex:1;text-align:center;padding:.45rem .4rem;font-size:.84rem}
  .hero,.article-card{padding:1.25rem}
  .cards{grid-template-columns:1fr;gap:.75rem}
  .card{min-height:8.25rem}
  .pdf-frame{height:23rem}
  .founder-box,.profile-header,.author-banner{flex-direction:column;text-align:center}
  .btn{width:100%}
  .form input,.form select,.form textarea{font-size:16px}
  footer .wrap{flex-direction:column;gap:.75rem}
}
@media (prefers-reduced-motion:reduce){.stage .rig,.photo,.card,.pcard,.btn{transition:none}}
</style>
</head>
<body>
<div class="photo" id="photo" aria-hidden="true"></div>
<div class="stage" aria-hidden="true"><div class="rig" id="rig"><img class="l1" src="logo.png" alt=""><img class="l2" src="logo.png" alt=""><img class="l3" src="logo.png" alt=""></div></div>

<header>
  <div class="wrap">
    <div class="top-bar">
      <a class="brand" href="#" aria-label="Paigham home"><img src="logo.png" alt="Paigham logo"> Paigham <small>Research Network</small></a>
      <nav aria-label="Main">
        <a href="#write" id="nav-write">+ Publish</a>
        <a href="#about" id="nav-about">About</a>
        <a href="#login" id="nav-login">Log in / Join</a>
      </nav>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
</header>

<main class="wrap" id="app" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span>&copy; <span id="year"></span> Paigham · Founded by M. Sulaiman Saeed</span>
    <span class="flinks">
      <a href="mailto:admin@paigham.live">Email</a>
      <a href="mailto:feedback@paigham.live">Feedback</a>
      <a href="https://instagram.com/paigham.live" target="_blank" rel="noopener noreferrer">Official Instagram</a>
      <a href="https://instagram.com/thesulaimansaeed" target="_blank" rel="noopener noreferrer">@thesulaimansaeed</a>
    </span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="posts.js"></script>
<script>
(function () {
  var app = document.getElementById("app");
  var cfg = window.PAIGHAM_CONFIG || {};
  var sb = null;
  try {
    if (cfg.supabaseUrl && cfg.supabaseKey && window.supabase) {
      sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storageKey: "paigham-auth"
        }
      });
    }
  } catch (err) {
    console.error("Supabase init error:", err);
  }

  var user = null;
  var profile = null;
  var profilesList = [];
  var mode = "login"; // login | signup | verify | forgot | reset
  var pendingEmail = "";
  var recovering = false;
  var community = [];
  var sciSub = "all";
  var lastActionAt = 0;

  var ALLOWED_IMG = ["image/jpeg", "image/png", "image/webp", "image/gif"];
  var ALLOWED_ALL = ["image/jpeg", "image/png", "image/webp", "image/gif", "application/pdf"];
  var MAX_BYTES = 10 * 1024 * 1024;

  var S = {
    science: {
      t: "Science",
      d: "Review articles, lab notes, photos, and PDFs across Physics, Chemistry, and Biology.",
      c: "#0d3b66",
      subs: { all: "All Branches", physics: "Physics", chemistry: "Chemistry", biology: "Biology" }
    },
    models: {
      t: "Model Organisms",
      d: "Zebrafish (Danio rerio), Drosophila, mice, C. elegans, and experimental disease models researchers are working on.",
      c: "#0f766e"
    },
    geopolitics: {
      t: "Geopolitics",
      d: "Share thoughts, essays, and analysis on global power, borders, resources, and world affairs.",
      c: "#4a3f28"
    },
    philosophy: {
      t: "Philosophy",
      d: "Open reflections, ethics of science, epistemology, and philosophical discussions.",
      c: "#2d3a4b"
    }
  };

  var keys = Object.keys(S);
  var yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  var tabsEl = document.getElementById("tabs");
  if (tabsEl) {
    tabsEl.innerHTML = '<a href="#" data-k="home">Home Feed</a>' + keys.map(function (k) {
      return '<a href="#' + k + '" data-k="' + k + '">' + S[k].t + '</a>';
    }).join("");
  }

  if (window.DOMPurify) {
    DOMPurify.addHook("afterSanitizeAttributes", function (n) {
      if (n.tagName === "A") {
        n.setAttribute("rel", "noopener noreferrer nofollow ugc");
        n.setAttribute("target", "_blank");
      }
    });
  }

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function fmt(d) {
    var dt = new Date(String(d).slice(0, 10) + "T00:00:00");
    return isNaN(dt.getTime()) ? String(d) : dt.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  }
  function mins(t) { return Math.max(1, Math.round(String(t || "").split(/\s+/).length / 220)); }
  function md(t) {
    var raw = window.marked ? marked.parse(String(t || "")) : esc(t);
    return window.DOMPurify ? DOMPurify.sanitize(raw, { ALLOWED_URI_REGEXP: /^(?:(?:https?|mailto):|[^a-z]|[a-z+.-]+(?:[^a-z+.-:]|$))/i }) : raw;
  }
  function ig(h) { return /^[A-Za-z0-9._]{1,30}$/.test(h || "") ? h : ""; }
  function safeUrl(u) {
    if (!u) return "";
    try {
      var parsed = new URL(u, location.origin);
      if (parsed.protocol === "https:" || parsed.origin === location.origin) return parsed.href;
    } catch (_e) {}
    return "";
  }
  function initials(name) {
    return String(name || "P").trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0] ? w[0].toUpperCase() : ""; }).join("") || "P";
  }
  function avatarHtml(url, name, cls) {
    var clean = safeUrl(url);
    if (clean) return '<img class="' + cls + '" src="' + esc(clean) + '" alt="' + esc(name) + '">';
    return '<span class="' + cls + '" aria-hidden="true">' + esc(initials(name)) + '</span>';
  }
  function setBg(k) { document.getElementById("photo").style.setProperty("--photo", "url(img/" + (k || "home") + ".jpg)"); }
  function setNav(which, sec) {
    ["write", "about", "login"].forEach(function (k) {
      var el = document.getElementById("nav-" + k);
      if (!el) return;
      if (k === which) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current");
    });
    document.querySelectorAll("#tabs a").forEach(function (a) {
      if (a.dataset.k === sec) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
  }

  function validateFile(file, imgOnly) {
    if (!file) return null;
    var list = imgOnly ? ALLOWED_IMG : ALLOWED_ALL;
    if (list.indexOf(file.type) === -1) {
      return imgOnly ? "Upload a JPG, PNG, WEBP, or GIF image." : "Unsupported file. Upload JPG, PNG, WEBP, GIF, or PDF only.";
    }
    if (file.size > MAX_BYTES) return "File exceeds 10 MB limit.";
    return null;
  }

  function uploadFile(file, folder, imgOnly) {
    if (!file) return Promise.resolve({ url: null, type: null });
    var err = validateFile(file, imgOnly);
    if (err) return Promise.reject(new Error(err));
    var ext = (file.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
    var mediaType = file.type === "application/pdf" ? "pdf" : "image";
    var path = user.id + "/" + folder + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "." + ext;

    return sb.storage.from("attachments").upload(path, file, {
      cacheControl: "3600",
      contentType: file.type,
      upsert: false
    }).then(function (res) {
      if (res.error) throw new Error("Upload failed: " + res.error.message);
      var pub = sb.storage.from("attachments").getPublicUrl(path);
      return { url: pub.data.publicUrl, type: mediaType };
    });
  }

  function bindPreview(inputEl, previewEl, imgOnly) {
    if (!inputEl || !previewEl) return;
    inputEl.onchange = function () {
      var file = inputEl.files && inputEl.files[0];
      if (!file) { previewEl.style.display = "none"; previewEl.innerHTML = ""; return; }
      var err = validateFile(file, imgOnly);
      if (err) {
        previewEl.style.display = "block";
        previewEl.innerHTML = '<span style="color:#c81e1e;font-weight:600">' + esc(err) + '</span>';
        inputEl.value = "";
        return;
      }
      previewEl.style.display = "block";
      var sizeMb = (file.size / (1024 * 1024)).toFixed(2);
      if (file.type === "application/pdf") {
        previewEl.innerHTML = '<strong>PDF attached:</strong> ' + esc(file.name) + ' (' + sizeMb + ' MB)';
      } else {
        var objUrl = URL.createObjectURL(file);
        previewEl.innerHTML = '<strong>Photo selected:</strong> ' + esc(file.name) + ' (' + sizeMb + ' MB)<img src="' + objUrl + '" alt="Preview">';
      }
    };
  }

  function renderMedia(url, type, title) {
    var clean = safeUrl(url);
    if (!clean) return "";
    if (type === "pdf") {
      return '<div class="media-wrap">' +
        '<div class="pdf-bar"><span><strong>Attached PDF Document</strong></span>' +
        '<a class="btn secondary" style="min-height:2.1rem;padding:.3rem .8rem;font-size:.85rem" href="' + esc(clean) + '" target="_blank" rel="noopener noreferrer">Open / Download PDF</a></div>' +
        '<iframe class="pdf-frame" src="' + esc(clean) + '#view=FitH" title="' + esc(title || "PDF") + '" loading="lazy"></iframe>' +
        '</div>';
    }
    if (type === "image") {
      return '<figure class="media-wrap"><img src="' + esc(clean) + '" alt="' + esc(title || "Figure") + '" loading="lazy"></figure>';
    }
    return "";
  }

  function all() {
    var mine = (Array.isArray(window.POSTS) ? window.POSTS : []).map(function (p) {
      return {
        id: p.slug,
        title: p.title,
        date: p.date || "2026-01-01",
        section: p.section,
        sub: p.sub_section || "",
        post_type: p.post_type || "article",
        excerpt: p.excerpt,
        body: p.body,
        media_url: p.media_url || "",
        media_type: p.media_type || "",
        author: "M. Sulaiman Saeed",
        study: "Biology (Wet-Lab Pathology & Zebrafish Models)",
        avatar: "dp.jpg",
        ig: "thesulaimansaeed"
      };
    });
    var com = (Array.isArray(community) ? community : []).map(function (p) {
      return {
        id: "c-" + p.id,
        title: p.title,
        date: p.created_at || "2026-01-01",
        section: p.section,
        sub: p.sub_section || "",
        post_type: p.post_type || "article",
        excerpt: p.excerpt,
        body: p.body,
        media_url: p.media_url || "",
        media_type: p.media_type || "",
        author: p.author_name,
        study: p.author_study || "",
        avatar: p.author_avatar || "",
        ig: ig(p.instagram)
      };
    });
    return mine.concat(com).sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  }

  function feedCards(list, emptyMsg) {
    if (!list.length) return '<div class="empty">' + (emptyMsg || 'No publications yet. <a href="#write">Publish the first review article, note, photo, or PDF</a>.') + '</div>';
    return '<div class="feed-list">' + list.map(function (p) {
      var subLabel = (p.section === "science" && p.sub && S.science.subs[p.sub]) ? S.science.subs[p.sub] : "";
      var typeBadge = p.post_type === "review" ? '<span class="badge review">Review Article</span>'
                    : p.post_type === "thought" ? '<span class="badge">Thought / Reflection</span>' : '';
      var mediaBadge = p.media_type === "pdf" ? '<span class="badge media">PDF</span>'
                     : p.media_type === "image" ? '<span class="badge media">Photo</span>' : '';
      return '<a class="pcard" href="#' + encodeURIComponent(p.id) + '">' +
        '<div class="pcard-top">' +
          '<div class="pcard-author">' + avatarHtml(p.avatar, p.author, "avatar-sm") +
            '<div class="pcard-meta"><strong>' + esc(p.author) + '</strong>' +
            '<span>' + esc(p.study || (S[p.section] ? S[p.section].t : "Contributor")) + '</span></div>' +
          '</div>' +
          '<div class="badges">' + typeBadge +
            (S[p.section] ? '<span class="badge">' + esc(S[p.section].t) + '</span>' : '') +
            (subLabel ? '<span class="badge">' + esc(subLabel) + '</span>' : '') +
            mediaBadge +
          '</div>' +
        '</div>' +
        '<h3>' + esc(p.title) + '</h3>' +
        (p.excerpt ? '<p>' + esc(p.excerpt) + '</p>' : '') +
        '<div class="pcard-foot"><span>' + fmt(p.date) + ' · ' + mins(p.body) + ' min read</span><span>Read &amp; Discuss →</span></div>' +
      '</a>';
    }).join("") + '</div>';
  }

  function sidebarHtml() {
    var membersHtml = profilesList.length
      ? profilesList.slice(0, 6).map(function (m) {
          return '<div class="member-item">' +
            avatarHtml(m.avatar_url, m.full_name, "avatar-sm") +
            '<div class="member-info">' +
              '<strong>' + esc(m.full_name) + '</strong>' +
              '<span>Studying: ' + esc(m.study_field) + '</span>' +
              '<small>Interests: ' + esc(m.future_interests) + '</small>' +
            '</div>' +
          '</div>';
        }).join("")
      : '<p class="note" style="font-size:.86rem">Join Paigham to showcase your field of study and future research interests here.</p>';

    return '<aside>' +
      '<div class="side-box">' +
        '<h3>Research Community</h3>' +
        membersHtml +
        '<p style="margin:.9rem 0 0"><a class="btn secondary" style="width:100%;min-height:2.35rem;font-size:.86rem" href="#login">' + (user ? "Edit Your Researcher Profile" : "Create Researcher Profile") + '</a></p>' +
      '</div>' +
      '<div class="side-box">' +
        '<h3>Publish Your Work</h3>' +
        '<p class="note" style="font-size:.86rem;margin-bottom:.85rem">Upload review articles across Physics, Chemistry &amp; Biology, share zebrafish or model organism findings, or post thoughts on Geopolitics &amp; Philosophy.</p>' +
        '<a class="btn" style="width:100%;min-height:2.4rem;font-size:.88rem" href="#write">+ Submit Article / PDF</a>' +
      '</div>' +
    '</aside>';
  }

  function home() {
    document.title = "Paigham — Research & Writing Network | M. Sulaiman Saeed"; setBg("home");
    var list = all().slice(0, 12);
    app.innerHTML = '<section class="hero">' +
      '<h1>Open Science, Model Organisms, Geopolitics &amp; Philosophy.</h1>' +
      '<p>Founded by <strong>M. Sulaiman Saeed</strong> — a collaborative space to publish review articles, share zebrafish and model organism research, upload PDFs &amp; figures, and exchange ideas.</p>' +
      '<div class="hero-actions">' +
        '<a class="btn" href="#write">+ Upload Review Article / Post</a>' +
        '<a class="btn secondary" href="#login">' + (user ? "My Researcher Profile" : "Join with Email Code") + '</a>' +
      '</div>' +
    '</section>' +
    '<div class="cards">' + keys.map(function (k) {
      return '<a class="card" href="#' + k + '" style="--c1:url(img/' + k + '.jpg);--c2:' + S[k].c + '"><h2>' + S[k].t + '</h2><p>' + S[k].d + '</p></a>';
    }).join("") + '</div>' +
    '<div class="feed-layout">' +
      '<div><div class="feed-head"><h2>Recent Publications &amp; Thoughts</h2></div>' + feedCards(list) + '</div>' +
      sidebarHtml() +
    '</div>';
    setNav("", "home");
  }

  function section(k) {
    document.title = S[k].t + " · Paigham"; setBg(k);
    var list = all().filter(function (p) { return p.section === k; });
    var subBar = "";

    if (k === "science") {
      var subs = S.science.subs;
      subBar = '<div class="subtabs" role="group" aria-label="Science branches">' +
        Object.keys(subs).map(function (sk) {
          return '<button type="button" class="subtab" data-sub="' + sk + '" aria-pressed="' + (sciSub === sk) + '">' + subs[sk] + '</button>';
        }).join("") + '</div>';
      if (sciSub !== "all") {
        list = list.filter(function (p) { return p.sub === sciSub; });
      }
    }

    var ctaLabel = k === "science" ? "+ Upload Review Article / Study"
                 : k === "models" ? "+ Share Model Organism Work"
                 : k === "geopolitics" ? "+ Share Geopolitical Thought"
                 : "+ Share Philosophical Thought";

    app.innerHTML = '<section class="hero"><h1>' + S[k].t + '</h1><p>' + S[k].d + '</p>' +
      '<div class="hero-actions"><a class="btn" href="#write?section=' + k + '">' + ctaLabel + '</a></div></section>' +
      subBar +
      '<div class="feed-layout">' +
        '<div>' + feedCards(list) + '</div>' +
        sidebarHtml() +
      '</div>';
    setNav("", k);

    if (k === "science") {
      app.querySelectorAll(".subtab").forEach(function (btn) {
        btn.onclick = function () {
          sciSub = btn.dataset.sub;
          section("science");
        };
      });
    }
  }

  function renderComments(postId) {
    var box = document.getElementById("comments-box");
    if (!box) return;
    if (!sb) {
      box.innerHTML = '<section class="comments"><h2>Discussion</h2><p class="note">Discussion requires Supabase connection.</p></section>';
      return;
    }

    var formHtml = user
      ? '<form class="form" id="cform">' +
        '<label>Contribute to the discussion<textarea class="short" name="body" minlength="1" maxlength="2000" placeholder="Write your academic feedback, question, or reflection..." required></textarea></label>' +
        '<label>Attach a figure, photo, or PDF (optional, max 10 MB)<input type="file" name="media" id="c-media" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf"></label>' +
        '<div id="c-preview" class="preview-box" style="display:none"></div>' +
        '<button class="btn" type="submit" id="csub">Post Response</button><p class="note" role="status" id="cmsg"></p></form>'
      : '<p class="note"><a href="#login" style="color:var(--accent);font-weight:600">Log in or create a researcher account</a> to comment or attach photos/PDFs.</p>';

    box.innerHTML = '<section class="comments"><h2>Peer Discussion (<span id="ccount">0</span>)</h2><div class="clist" id="clist"><p class="note">Loading responses…</p></div>' + formHtml + '</section>';

    var cMediaInput = document.getElementById("c-media");
    var cPreview = document.getElementById("c-preview");
    if (cMediaInput && cPreview) bindPreview(cMediaInput, cPreview, false);

    function loadList() {
      sb.from("comments").select("id,user_id,author_name,author_study,author_avatar,instagram,body,media_url,media_type,created_at").eq("post_id", postId).order("created_at", { ascending: true })
        .then(function (r) {
          var items = r.data || [];
          var countEl = document.getElementById("ccount");
          var clist = document.getElementById("clist");
          if (!countEl || !clist) return;
          countEl.textContent = items.length;
          if (!items.length) {
            clist.innerHTML = '<p class="note">No responses yet. Start the discussion below.</p>';
            return;
          }
          clist.innerHTML = "";
          items.forEach(function (c) {
            var div = document.createElement("div");
            div.className = "citem";
            var head = document.createElement("div");
            head.className = "chead";

            var left = document.createElement("div");
            left.className = "cuser";
            left.innerHTML = avatarHtml(c.author_avatar, c.author_name, "avatar-sm");

            var info = document.createElement("span");
            var strong = document.createElement("strong");
            strong.style.color = "var(--ink)";
            strong.textContent = c.author_name;
            info.appendChild(strong);
            if (c.author_study) info.append(" · " + c.author_study);
            if (ig(c.instagram)) {
              var a = document.createElement("a");
              a.href = "https://instagram.com/" + ig(c.instagram);
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.style.color = "var(--accent)";
              a.textContent = " (@" + ig(c.instagram) + ")";
              info.appendChild(a);
            }
            info.append(" · " + fmt(c.created_at));
            left.appendChild(info);
            head.appendChild(left);

            if (user && user.id === c.user_id) {
              var del = document.createElement("button");
              del.type = "button";
              del.className = "linkbtn";
              del.textContent = "Delete";
              del.onclick = function () {
                sb.from("comments").delete().eq("id", c.id).then(loadList);
              };
              head.appendChild(del);
            }

            var p = document.createElement("p");
            p.className = "cbody";
            p.textContent = c.body;

            div.appendChild(head);
            div.appendChild(p);

            var cleanMedia = safeUrl(c.media_url);
            if (cleanMedia) {
              var mWrap = document.createElement("div");
              mWrap.className = "cmedia";
              if (c.media_type === "pdf") {
                var pdfLink = document.createElement("a");
                pdfLink.className = "btn secondary";
                pdfLink.style.minHeight = "2.1rem";
                pdfLink.style.padding = ".3rem .8rem";
                pdfLink.style.fontSize = ".85rem";
                pdfLink.href = cleanMedia;
                pdfLink.target = "_blank";
                pdfLink.rel = "noopener noreferrer";
                pdfLink.textContent = "View Attached PDF";
                mWrap.appendChild(pdfLink);
              } else if (c.media_type === "image") {
                var img = document.createElement("img");
                img.src = cleanMedia;
                img.alt = "Attachment by " + c.author_name;
                img.loading = "lazy";
                mWrap.appendChild(img);
              }
              div.appendChild(mWrap);
            }

            clist.appendChild(div);
          });
        });
    }

    loadList();

    var cf = document.getElementById("cform");
    if (cf) {
      cf.onsubmit = function (e) {
        e.preventDefault();
        var now = Date.now();
        var cmsg = document.getElementById("cmsg");
        var csub = document.getElementById("csub");
        if (now - lastActionAt < 5000) { cmsg.textContent = "Please wait a few seconds before posting again."; return; }
        var text = cf.body.value.trim();
        if (!text) return;
        var file = cf.media && cf.media.files ? cf.media.files[0] : null;
        var fileErr = validateFile(file, false);
        if (fileErr) { cmsg.textContent = fileErr; return; }

        lastActionAt = now;
        csub.disabled = true;
        cmsg.textContent = file ? "Uploading & posting…" : "Posting…";

        uploadFile(file, "comment", false).then(function (uploaded) {
          var m = user.user_metadata || {};
          var displayName = (profile && profile.full_name) || m.name || user.email.split("@")[0];
          var studyField = (profile && profile.study_field) || m.study_field || "";
          var avatarUrl = (profile && profile.avatar_url) || m.avatar_url || null;
          var instaHandle = (profile && profile.instagram) || m.instagram || "";

          return sb.from("comments").insert({
            post_id: postId,
            author_name: displayName.slice(0, 80),
            author_study: studyField.slice(0, 120) || null,
            author_avatar: avatarUrl,
            instagram: ig(instaHandle) || null,
            body: text,
            media_url: uploaded.url,

      var f = e.target;
      var file = f.media && f.media.files ? f.media.files[0] : null;
      var fileErr = validateFile(file, false);
      if (fileErr) { msg.textContent = fileErr; return; }

      lastActionAt = now;
      wsub.disabled = true;
      msg.textContent = file ? "Uploading attachment & submitting…" : "Submitting…";

      uploadFile(file, "post", false).then(function (uploaded) {
        var displayName = (profile && profile.full_name) || m.name || user.email.split("@")[0];
        var studyField = (profile && profile.study_field) || m.study_field || "";
        var avatarUrl = (profile && profile.avatar_url) || m.avatar_url || null;
        var instaHandle = (profile && profile.instagram) || m.instagram || "";

        var payload = {
          section: f.section.value,
          sub_section: f.section.value === "science" ? f.sub_section.value : null,
          post_type: f.post_type.value,
          title: f.title.value.trim(),
          excerpt: f.excerpt.value.trim(),
          body: f.body.value,
          media_url: uploaded.url,
          media_type: uploaded.type,
          author_name: displayName.slice(0, 80),
          author_study: studyField.slice(0, 120) || null,
          author_avatar: avatarUrl,
          instagram: ig(instaHandle) || null
        };
        return sb.from("posts").insert(payload);
      }).then(function (r) {
        wsub.disabled = false;
        if (r.error) { msg.textContent = "Couldn’t submit: " + r.error.message; return; }
        f.reset();
        if (wPreview) { wPreview.innerHTML = ""; wPreview.style.display = "none"; }
        toggleSub();
        msg.textContent = "Submitted! Your work will appear on the feed once approved.";
      }).catch(function (err) {
        wsub.disabled = false;
        msg.textContent = err.message || "Upload error.";
      });
    };
  }

  function route() {
    var raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var parts = raw.split("?");
    var h = parts[0];
    var params = new URLSearchParams(parts[1] || "");
    if (!h) home();
    else if (S[h]) section(h);
    else if (h === "about") about();
    else if (h === "login") login();
    else if (h === "write") write(params.get("section"));
    else post(h);
    window.scrollTo(0, 0);
  }

  function syncProfileOnLogin() {
    if (!sb || !user) return Promise.resolve();
    return sb.from("profiles").select("*").eq("id", user.id).maybeSingle().then(function (r) {
      if (r.data) {
        profile = r.data;
        return;
      }
      var m = user.user_metadata || {};
      if (m.study_field && m.future_interests) {
        var newProf = {
          id: user.id,
          full_name: (m.name || user.email.split("@")[0]).slice(0, 80),
          study_field: String(m.study_field).slice(0, 120),
          future_interests: String(m.future_interests).slice(0, 300),
          bio: m.bio || null,
          instagram: ig(m.instagram) || null,
          avatar_url: m.avatar_url || null
        };
        return sb.from("profiles").upsert(newProf).then(function () {
          profile = newProf;
          return loadAllProfiles();
        });
      }
    });
  }

  function loadMyProfile() {
    if (!sb || !user) { profile = null; return Promise.resolve(); }
    return sb.from("profiles").select("*").eq("id", user.id).maybeSingle().then(function (r) {
      profile = r.data || null;
    });
  }

  function loadAllProfiles() {
    if (!sb) return Promise.resolve();
    return sb.from("profiles").select("id,full_name,study_field,future_interests,bio,instagram,avatar_url").order("updated_at", { ascending: false }).limit(20)
      .then(function (r) { profilesList = r.data || []; });
  }

  function loadCommunity() {
    if (!sb) return Promise.resolve();
    return sb.from("posts").select("id,title,section,sub_section,post_type,excerpt,body,media_url,media_type,created_at,author_name,author_study,author_avatar,instagram").eq("approved", true).order("created_at", { ascending: false }).limit(100)
      .then(function (r) { community = r.data || []; });
  }

  function refresh() {
    document.getElementById("nav-login").textContent = user ? "My Profile" : "Log in / Join";
    if (recovering) return;
    if (/^#(login|write)/.test(location.hash)) route();
  }

  var rig = document.getElementById("rig");
  if (!window.matchMedia("(prefers-reduced-motion:reduce)").matches) {
    window.addEventListener("pointermove", function (e) {
      rig.style.setProperty("--ry", ((e.clientX / innerWidth - .5) * 30) + "deg");
      rig.style.setProperty("--rx", ((.5 - e.clientY / innerHeight) * 20) + "deg");
    });
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.update(); });
      });
      navigator.serviceWorker.register("sw.js");
    });
  }
  window.addEventListener("hashchange", route);
  route();

  if (sb) {
    Promise.all([loadCommunity(), loadAllProfiles()]).then(function () {
      if (!/^#(login|write|about)/.test(location.hash)) route();
    });
    sb.auth.getSession().then(function (r) {
      user = r.data.session ? r.data.session.user : null;
      syncProfileOnLogin().then(refresh);
    });
    sb.auth.onAuthStateChange(function (_e, s) {
      user = s ? s.user : null;
      syncProfileOnLogin().then(refresh);
    });
  }
})();
</script>
</body>
</html>
